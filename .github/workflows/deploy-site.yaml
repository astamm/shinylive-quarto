name: deploy-site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # R + Quarto on the runner. Rendering the deck fires its pre-render hook,
      # which itself calls `quarto render` on the two iframed examples.
      - uses: r-lib/actions/setup-r@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::shiny, any::dplyr, any::ggplot2, any::readr,
                     any::shinylive, any::httpuv, any::gt, any::palmerpenguins

      - name: Render site
        run: |
          cd site
          chmod +x build-site.sh
          quarto render

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
