project:
  type: website
  render:
    - index.qmd
  pre-render: ./build-site.sh
  output-dir: _site
  resources:
    # build-site.sh renders each artifact into a site-local staging folder;
    # Quarto copies each into the _site root, so the deployed site's nav links
    # (slides/slides.html, labs/..., example-app/..., example-report/...) resolve.
    - slides/**
    - labs/**
    - example-app/**
    - example-report/**
    - material.zip

website:
  title: "Serverless Interactive Reporting"
  navbar:
    left:
      - text: "Home"
        href: index.html
      - text: "Slides"
        href: slides/slides.html
      - text: "Labs"
        menu:
          - text: "Lab 1 - Quarto"
            href: labs/lab-01-quarto.html
          - text: "Lab 2 - Shiny"
            href: labs/lab-02-shiny.html
          - text: "Lab 3 - Shinylive"
            href: labs/lab-03-shinylive.html
          - text: "Lab 4 - Interactive report"
            href: labs/lab-04-shinylive-quarto.html
      - text: "Examples"
        menu:
          - text: "Standalone app"
            href: example-app/index.html
          - text: "Interactive report"
            href: example-report/report.html
  page-footer:
    left: "Quarto + Shiny + Shinylive workshop"

format:
  html:
    theme: cosmo
    embed-resources: true
